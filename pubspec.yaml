name: zingzone
description: "ZingZone - Micro-rewards, reels, live WebRTC & community app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Ads Engine (Updated for Gradle 8 compatibility)
  google_mobile_ads: ^5.1.0

  # Firebase Core & Firestore
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0

  # WebRTC Audio & Video
  flutter_webrtc: ^0.11.7

  # UI Icons & Helpers
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
