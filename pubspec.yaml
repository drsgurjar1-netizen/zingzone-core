name: zingzone
description: Next-gen entertainment, P2P live squads, and micro-rewards platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Firebase Core Engine (Auth, Cloud Firestore)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # AdMob Monetization
  google_mobile_ads: ^3.0.0

  # Zero-Cost P2P Voice & Video Hub
  flutter_webrtc: ^0.9.48

  # Reels & Video Player
  video_player: ^2.8.2
  preload_page_view: ^0.2.0

  # Security, Root Detection & Encryption (Anti-Cheat & Anti-MOD)
  flutter_jailbreak_detection: ^1.7.1
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Web Linking & Storage
  url_launcher: ^6.2.4
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    
